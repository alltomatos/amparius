<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" role="img" aria-labelledby="ampariusTitle ampariusDesc">
  <title id="ampariusTitle">Amparius - Sistema Funerário e Cemiterial</title>
  <desc id="ampariusDesc">Logomarca vetorial da Amparius contendo símbolo circular azul com letra A estilizada, mão acolhedora e seta ascendente, acompanhado da tipografia amparius e o subtítulo Sistema Funerário e Cemiterial.</desc>

