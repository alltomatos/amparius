[package]
name = "amparius-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Cliente desktop shell do Amparius, papel estação"
license = "Proprietary"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

