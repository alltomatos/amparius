services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: amparius
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - amparius_staging_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d amparius"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      ENABLE_DEV_ONBOARDING: "true"
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      POSTGRES_DSN: postgres://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/amparius?sslmode=disable
    ports:
      - "18080:8080"

volumes:
  amparius_staging_pgdata:
