# Amparius — ambiente local de desenvolvimento (Fase 0)
# Uso: docker compose up -d   (ou: .\scripts\dev.ps1 up)
# Credenciais são de DEV local apenas; nada de segredo de produção aqui.

services:
  postgres:
    image: postgres:16-alpine
    container_name: amparius-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amparius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amparius}
      POSTGRES_DB: ${POSTGRES_DB:-amparius}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amparius} -d ${POSTGRES_DB:-amparius}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: amparius-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: amparius-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-amparius}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-amparius}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
